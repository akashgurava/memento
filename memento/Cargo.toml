[package]
name = "memento"
version = "0.0.1"
description = "Photo library manager and deduplication engine"
edition = "2021"

[lib]
name = "memento"

[[bin]]
name = "memento"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# bundled = ["duckdb/bundled"]
cli = ["dep:clap"]

[dependencies]
# Base
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["yaml"] }

# CLI
clap = { version = "4", features = ["derive"], optional = true }
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
