[package]
name = "memento"
version = "0.0.1"
description = "Photo library manager and deduplication engine"
edition = "2021"

[lib]
name = "memento"

[[bin]]
name = "memento"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# bundled = ["duckdb/bundled"]
cli = ["dep:clap", "dep:ctrlc", "dep:indicatif", "dep:tracing-subscriber"]

[dependencies]
# Base
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
crossbeam = "0.8"

# Filesystem
ignore = "0.4"
shellexpand = "3.1.2"

# DB
duckdb = { version = "1", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", optional = true }
indicatif = { version = "0.18", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

