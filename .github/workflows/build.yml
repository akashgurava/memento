name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DUCKDB_VERSION: "v1.5.3"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p memento -- --check
      - name: Clippy
        run: cargo clippy -p memento --no-default-features --features cli -- -D warnings
      - name: Check (lib)
        run: cargo check -p memento --no-default-features
      - name: Check (cli)
        run: cargo check -p memento --no-default-features --features cli

  test:
    name: Test (${{ matrix.name }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            duckdb_zip: libduckdb-windows-amd64.zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux/macOS: let libduckdb-sys download the pre-built library
      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: cargo test -p memento --no-default-features
        env:
          DUCKDB_DOWNLOAD_LIB: "1"

      # Windows: download and extract pre-built DuckDB, point build at it
      - name: Download DuckDB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download ${{ env.DUCKDB_VERSION }} --repo duckdb/duckdb --pattern ${{ matrix.duckdb_zip }}
          Expand-Archive -Path ${{ matrix.duckdb_zip }} -DestinationPath ${{ github.workspace }}/libduckdb
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add DuckDB to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${{ github.workspace }}/libduckdb" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p memento --no-default-features
        env:
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libduckdb
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libduckdb

  build:
    name: Build (${{ matrix.artifact }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: memento-windows-x64
            ext: .exe
            duckdb_zip: libduckdb-windows-amd64.zip
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: memento-macos-x64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: memento-macos-arm64
            ext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: memento-linux-x64
            ext: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      # Unix: bundled (compiles DuckDB from source — fast on Linux/macOS)
      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: cargo build -p memento --features cli --release --target ${{ matrix.target }}

      # Windows: use pre-built DuckDB to avoid OOM from C++ unity build
      - name: Download DuckDB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download ${{ env.DUCKDB_VERSION }} --repo duckdb/duckdb --pattern ${{ matrix.duckdb_zip }}
          Expand-Archive -Path ${{ matrix.duckdb_zip }} -DestinationPath ${{ github.workspace }}/libduckdb
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p memento --no-default-features --features cli --release --target ${{ matrix.target }}
        env:
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libduckdb
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libduckdb

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/memento memento-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg
          Copy-Item target/${{ matrix.target }}/release/memento.exe pkg/
          Copy-Item libduckdb/duckdb.dll pkg/
          Compress-Archive -Path pkg/* -DestinationPath memento-${{ matrix.target }}.zip

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: memento-${{ matrix.target }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: memento-${{ matrix.target }}.zip

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
